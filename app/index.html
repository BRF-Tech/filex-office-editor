<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office editor</title>
<link rel="stylesheet" href="filex/app.css">
<script src="editor/filex/storage.js"></script>
<script src="filex/app.js" defer></script>
</head>
<body>
<main id="fx-shell">
  <div id="fx-editor-box"><div id="fx-editor"></div></div>
  <div id="fx-status" role="status" aria-live="polite"><div class="fx-spin" aria-hidden="true"></div><p id="fx-status-text"></p>
    <form id="fx-password" hidden><label id="fx-password-label" for="fx-password-input"></label><input id="fx-password-input" type="password" autocomplete="off"><span class="fx-password-buttons"><button id="fx-password-open" type="submit"></button><button id="fx-password-cancel" type="button"></button></span></form>
  </div>
  <footer id="fx-foot"><button id="fx-switch" type="button" hidden></button><p id="fx-legal"></p></footer>
</main>
</body>
</html>
